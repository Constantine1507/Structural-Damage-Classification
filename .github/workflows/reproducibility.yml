name: Reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient nbconvert ipykernel
      - name: Unit and leakage checks
        run: python -m pytest -q
      - name: Execute evidence notebook using competition data
        run: |
          mkdir -p artifacts/ci
          python -m jupyter nbconvert --execute --to notebook             notebooks/09_end_to_end_verified.ipynb             --ExecutePreprocessor.timeout=600             --output 09_ci_executed.ipynb             --output-dir artifacts/ci
      - name: Upload executed notebook and machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-reproduction-notebook
          path: |
            artifacts/ci/09_ci_executed.ipynb
            artifacts/reproduction_evidence/verified_evidence.json
          if-no-files-found: warn
