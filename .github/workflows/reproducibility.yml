name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient nbconvert ipykernel

      - name: Unit and leakage tests
        run: python -m pytest -q

      - name: Verify archived submission 010
        run: |
          python -m scripts.audit_submission10 \
            --data data/structural-damage-classification.zip \
            --submission "submissions/010_Constantine(10).csv" \
            --output artifacts/ci/submission010

      - name: Re-execute reproducibility notebook
        run: |
          mkdir -p artifacts/ci
          python -m jupyter nbconvert \
            --to notebook \
            --execute notebooks/09_end_to_end_verified.ipynb \
            --ExecutePreprocessor.timeout=600 \
            --output 09_ci_executed.ipynb \
            --output-dir artifacts/ci

      - name: Execute both final submission notebooks
        run: |
          python -m jupyter nbconvert --to notebook --execute notebooks/03_submission.ipynb \
            --ExecutePreprocessor.timeout=600 --output 03_ci_executed.ipynb --output-dir artifacts/ci
          python -m jupyter nbconvert --to notebook --execute notebooks/06_hasil_akhir.ipynb \
            --ExecutePreprocessor.timeout=600 --output 06_ci_executed.ipynb --output-dir artifacts/ci

      - name: Verify submission 010/012 comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = Path("artifacts/submission_review")
          comparison = json.loads((a / "submission_010_012_review.json").read_text())
          decision = json.loads((a / "final_decision.json").read_text())
          assert comparison["versions"]["010"]["sample_order_identical"]
          assert comparison["versions"]["012"]["sample_order_identical"]
          assert comparison["versions"]["010"]["rows"] == 228629
          assert comparison["versions"]["012"]["rows"] == 228629
          assert comparison["changed_predictions"] == 20831
          assert comparison["hidden_test_labels_used"] is False
          assert comparison["reported_public_delta_012_minus_010"] == -0.00178
          assert decision["reported_public_macro_f1"] == {"010": 0.60627, "012": 0.60449}
          assert decision["private_macro_f1"] is None
          assert Path("artifacts/ci/03_ci_executed.ipynb").is_file()
          assert Path("artifacts/ci/06_ci_executed.ipynb").is_file()
          print("Final submission evidence PASS")
          PY

      - name: Assert execution evidence was produced
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook = Path("artifacts/ci/09_ci_executed.ipynb")
          evidence = Path("artifacts/reproduction_evidence/verified_evidence.json")
          assert notebook.is_file() and evidence.is_file()
          report = json.loads(evidence.read_text(encoding="utf-8"))
          assert report["submission010"]["sample_order_identical"]
          assert report["submission010"]["rows"] == 228629
          assert report["dataset"]["train_rows"] == 533465
          assert report["smoke"]["saved_model_reloaded_predictions_identical"]
          assert report["smoke"]["fit_rows"] == 9600
          assert report["smoke"]["validation_rows"] == 2400
          assert report["historical_checkpoint"]["status"] in {"SKIPPED", "VERIFIED"}
          assert report["submission010"]["exact_original_training_reproduced"] is False
          print("Reproduction evidence PASS")
          PY

      - name: Upload executed notebook and verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission010-reproduction-evidence
          path: |
            artifacts/ci/09_ci_executed.ipynb
            artifacts/ci/03_ci_executed.ipynb
            artifacts/ci/06_ci_executed.ipynb
            artifacts/submission_review/
            artifacts/ci/submission010/submission10_integrity.json
            artifacts/reproduction_evidence/verified_evidence.json
          if-no-files-found: warn
